<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="cellar social preview">
  <title>cellar — Mac mini M4 launcher for Windows games</title>
  <!-- backdrop -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#purpleGlow)"/>

  <!-- subtle horizontal "rack lines" backdrop -->
  <g opacity="0.04" stroke="#fafafa" stroke-width="1">
    <line x1="0" y1="220" x2="1280" y2="220"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="420" x2="1280" y2="420"/>
  </g>

  <!-- big icon centered top -->
  <g transform="translate(548, 90)">
    <rect x="0" y="0" width="184" height="184" rx="24" fill="#0a0a0a" stroke="#fafafa" stroke-width="6"/>
    <g>
      <rect x="20" y="32" width="120" height="20" rx="6" fill="#a78bfa"/>
      <rect x="140" y="37" width="18" height="10" rx="3" fill="#a78bfa"/>
      <rect x="20" y="80" width="120" height="20" rx="6" fill="#fbbf24"/>
      <rect x="140" y="85" width="18" height="10" rx="3" fill="#fbbf24"/>
      <rect x="20" y="128" width="120" height="20" rx="6" fill="#a78bfa"/>
      <rect x="140" y="133" width="18" height="10" rx="3" fill="#a78bfa"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="640" y="370" text-anchor="middle"
        font-family="system-ui, -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
        font-weight="700" font-size="120" fill="#fafafa" letter-spacing="-3">cellar</text>

  <!-- tagline -->
  <text x="640" y="430" text-anchor="middle"
        font-family="system-ui, -apple-system, 'SF Pro Text', sans-serif"
        font-weight="500" font-size="32" fill="#d4d4d8">
    Mac mini M4 launcher for Windows games
  </text>
  <text x="640" y="478" text-anchor="middle"
        font-family="system-ui, -apple-system, 'SF Pro Text', sans-serif"
        font-weight="400" font-size="24" fill="#a3a3a3">
    CrossOver wine 11.0  ·  Apple GPTK D3DMetal 3.0  ·  60+ games across 10 engines
  </text>

  <!-- footer hints -->
  <g transform="translate(0, 560)">
    <text x="640" y="0" text-anchor="middle"
          font-family="ui-monospace, 'SF Mono', Menlo, monospace"
          font-size="20" fill="#737373">
      github.com/joemunene-by/cellar
    </text>
  </g>
</svg>
